name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          if find . -name '*.go' | grep -q .; then
            test -z "$(gofmt -l .)"
          fi

      - name: go vet
        run: |
          if find . -name '*.go' | grep -q .; then
            go vet ./...
          fi

      - name: go test
        run: |
          if find . -name '*.go' | grep -q .; then
            go test ./...
          fi

      - name: check-docs
        run: bash scripts/check-docs.sh
